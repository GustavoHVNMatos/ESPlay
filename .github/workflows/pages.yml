name: Publicar ESPlay no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Localizar pasta public
        id: locate
        run: |
          if [ -f "public/index.html" ]; then
            echo "dir=public" >> "$GITHUB_OUTPUT"
          elif [ -f "esplay-site/public/index.html" ]; then
            echo "dir=esplay-site/public" >> "$GITHUB_OUTPUT"
          else
            echo "Nao encontrei public/index.html na raiz nem em esplay-site/public/" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.locate.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
